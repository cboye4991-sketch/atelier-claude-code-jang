name = "jang-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Plain (non-secret) settings. The API key is NOT here:
#   npx wrangler secret put DIFY_API_KEY
[vars]
DIFY_API_URL = "https://api.dify.ai/v1"
# Origins = scheme + host (+ port), no path, no trailing slash.
ALLOWED_ORIGINS = "https://cboye4991-sketch.github.io,http://localhost:8000,http://127.0.0.1:8000,http://localhost:5173,http://localhost:4173"

# Rate limiting binding: 5 requests per 60 s per client IP (see src/index.js).
# namespace_id is any integer unique in your Cloudflare account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
